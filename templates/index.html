<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musicboxd - Iniciar sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Musicboxd</h1>
  <div class="contenedor">
    <h2>Iniciar sesión</h2>
    <form>
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="usuario@ejemplo.com">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" placeholder="••••••••">
      <button class="boton">Entrar</button>
    </form>
    <p class="texto-pequeño">¿No tienes cuenta? <a href="registro.html">Crear una nueva</a></p>
  </div>
</body>
</html>
