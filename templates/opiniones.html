<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musicboxd - Opiniones</title>
  
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
  <header>
    <h1>Musicboxd</h1>
    <nav>
      <a href="agregar-cancion.html"><b>+ Agregar Canción</b></a>
    </nav>
  </header>
  <main>
    <section>
      <h2>Opiniones de usuarios</h2>
      
      <div class="opiniones-list">
        </div>
      
      <h3>Publicar una opinión</h3>
      <form id="form-opinion">
        <label for="opinion-cancion-id">ID de la Canción a reseñar:</label>
        <input type="number" id="opinion-cancion-id" placeholder="Ej: 1" required>
        
        <label for="opinion-calificacion">Calificación (1-5 estrellas):</label>
        <input type="number" id="opinion-calificacion" min="1" max="5" placeholder="Ej: 5" required>
        
        <label for="opinion-comentario">Comentario:</label>
        <textarea id="opinion-comentario" placeholder="Escribe tu opinión aquí..." rows="4"></textarea>
        
        <button type="submit" class="boton botonPublicar">Publicar</button>
      </form>
      
    </section>
  </main>
  
  <script src="../static/opiniones.js"></script>
</body>
</html>
