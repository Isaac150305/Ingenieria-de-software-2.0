<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musicboxd - Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Musicboxd</h1>
  <div class="contenedor">
    <h2>Crear cuenta</h2>
    <form>
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Tu nombre">
      <label for="usuario">Nombre de usuario</label>
      <input type="text" id="usuario" placeholder="Tu nickname">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="usuario@ejemplo.com">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" placeholder="••••••••">
      <button class="boton">Registrar</button>
    </form>
    <p class="texto-pequeño">¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
  </div>
</body>
</html>
