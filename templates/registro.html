<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musicboxd - Registro</title>
  
  <link rel="stylesheet" href="../static/css/style.css">
  
</head>
<body>
  <h1>Musicboxd</h1>
  <div class="contenedor">
    <h2>Crear cuenta</h2>
    
    <form id="form-registro">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Tu nombre" required>
      
      <label for="usuario">Nombre de usuario</label>
      <input type="text" id="usuario" placeholder="Tu nickname" required>
      
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="usuario@ejemplo.com" required>
      
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" placeholder="••••••••" required>
      
      <button type_ ="submit" class="boton" id="btn-registrar">Registrar</button>
    </form>
    
    <p class="texto-pequeño">¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
  </div>
  
  <script src="../static/login.js"></script>
  
</body>
</html>
